name: CI

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'installer/**'
      - 'GlDrive.sln'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'installer/**'
      - 'GlDrive.sln'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  core-test:
    # Fast, platform-independent feedback with no desktop or native runtime graph.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore Core tests
        run: dotnet restore src/GlDrive.Core.Tests/GlDrive.Core.Tests.csproj --locked-mode -warnaserror:NU1901,NU1902,NU1903,NU1904
      - name: Test Core
        run: dotnet test src/GlDrive.Core.Tests/GlDrive.Core.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"

  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Tests cover pure logic, persistence, and isolated loopback HTTP requests.
      # Restore the full solution so Core, app and MCP test assets are available
      # before building with --no-restore; all three suites remain in the full gate.
      # WinFsp/GnuTLS native bits come from NuGet (winfsp.net, FluentFTP.GnuTLS)
      # and aren't exercised by the tests (no mount / no live FTP).
      - name: Restore
        run: dotnet restore GlDrive.sln --locked-mode -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Build (Release)
        run: dotnet build GlDrive.sln -c Release --no-restore

      - name: Test
        run: dotnet test GlDrive.sln -c Release --no-build --no-restore --logger "console;verbosity=normal"

      - name: Test publish manifest guard
        run: powershell -NoProfile -File installer/tests/Test-PublishManifest.ps1

      - name: Audit dependencies
        run: dotnet list GlDrive.sln package --vulnerable --include-transitive
